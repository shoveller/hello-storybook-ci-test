name: Setup
on:
  workflow_call:    # 다른 워크플로우에서 호출 가능하도록 설정

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
    
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: 의존성 설치
        run: pnpm i --frozen-lockfile 